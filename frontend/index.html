<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Request Queue — governed approval backend</title>
    <script>
      // Sets the `dark` class before first paint, so the page never flashes
      // light before switching. This app defaults to dark; an explicit "light"
      // choice opts out. Keep this inline and above the stylesheet.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          document.documentElement.classList.toggle("dark", stored !== "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
